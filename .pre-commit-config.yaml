# Preserve the hash-verified research handoff. Active experiments remain linted.
exclude: ^(workbench/|experiments/gdn_preprocessing/)
repos:
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
    -   id: black
-   repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
    -   id: isort
        args:
            - --profile=black
-   repo: local
    hooks:
    -   id: verify-research-handoff
        name: Verify immutable research handoff
        entry: python3 workbench/verify_inventory.py
        language: system
        pass_filenames: false
        always_run: true
