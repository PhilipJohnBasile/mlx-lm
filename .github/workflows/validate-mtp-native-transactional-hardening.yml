name: Finalize MTP transactional hardening branch

on:
  pull_request:
    branches:
      - test/mtp-native-transactional-hardening

permissions:
  contents: write

concurrency:
  group: finalize-mtp-native-transactional-hardening
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'PhilipJohnBasile/mlx-lm' &&
      github.head_ref == 'trigger/mtp-native-transactional-validation'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mtp-native-transactional-hardening
          fetch-depth: 0

      - name: Restore base server behavior and squash to one commit
        env:
          BASE_SHA: e8ceeccf118d4a089e22431f28f89d5ffe7d9d2b
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("mlx_lm/server.py")
          text = path.read_text()
          old = '''    def load(self, model_path, adapter_path=None, draft_model_path=None):
              model_path = self._model_map.get(model_path, model_path)
              adapter_path = self._adapter_map.get(model_path, adapter_path)
              draft_model_path = self._draft_model_map.get(draft_model_path, draft_model_path)
          '''
          new = '''    def load(self, model_path, adapter_path=None, draft_model_path=None):
              adapter_path = self._adapter_map.get(model_path, adapter_path)
              model_path = self._model_map.get(model_path, model_path)
              draft_model_path = self._draft_model_map.get(draft_model_path, draft_model_path)
          '''
          if text.count(old) == 1:
              path.write_text(text.replace(old, new, 1))
          elif text.count(new) != 1:
              raise RuntimeError("adapter-resolution block is neither original nor corrected")
          PY

          git diff --check
          git reset --soft "$BASE_SHA"
          git add -A

          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git commit -m "fix(mtp): harden transactional cache, logprobs, and guards

Carry the selected correctness work from ml-explore/mlx-lm#1740 onto
AirRunner/mlx-lm:feat/mtp-native at e8ceeccf118d4a089e22431f28f89d5ffe7d9d2b.

This preserves transactional multi-turn prompt-cache alignment and
finalization, target/verifier log probabilities for accepted drafts,
usable-head detection, fail-closed logits-processor handling, and the
focused regression coverage.

Source: PhilipJohnBasile/mlx-lm@bc1d11414c12372cdf76538e09ce1fbc54b7fc7b

Signed-off-by: Philip John Basile <PBasile@Basilecom.com>"

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          expected=$(cat <<'EOF'
          mlx_lm/generate.py
          mlx_lm/models/cache.py
          mlx_lm/models/qwen3_5.py
          mlx_lm/models/qwen3_5_moe.py
          mlx_lm/server.py
          tests/test_mtp.py
          EOF
          )
          actual=$(git diff --name-only "$BASE_SHA" HEAD | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)"

          python - <<'PY'
          from pathlib import Path

          text = Path("mlx_lm/server.py").read_text()
          correct = '''    def load(self, model_path, adapter_path=None, draft_model_path=None):
              adapter_path = self._adapter_map.get(model_path, adapter_path)
              model_path = self._model_map.get(model_path, model_path)
          '''
          if text.count(correct) != 1:
              raise RuntimeError("base adapter-alias resolution order was not preserved")
          PY

          git push --force-with-lease origin HEAD:fix/mtp-native-transactional-hardening
