name: Validate vLLM Metal hybrid GDN speculative state blocks

on:
  push:
    branches:
      - automation/vllm-metal-gdn-spec-blocks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@v5

      - name: Check out pinned vllm-metal source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          git clone https://github.com/vllm-project/vllm-metal.git work/vllm-metal
          git -C work/vllm-metal checkout 083f581f048b1b4460f166b31ec18dc6ec000e17

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/vllm-metal/tools
          cat tools/vllm_metal_gdn_spec_parts/part*.b64 \
            | tr -d '\n' \
            | base64 --decode \
            > work/vllm-metal/tools/apply_gdn_spec_blocks.py
          cp tools/apply_vllm_metal_gdn_spec_safety.py \
            work/vllm-metal/tools/apply_gdn_spec_safety.py
          cp tools/apply_vllm_metal_gdn_spec_test_updates.py \
            work/vllm-metal/tools/apply_gdn_spec_test_updates.py
          cp tools/apply_vllm_metal_gdn_wrapper_tests.py \
            work/vllm-metal/tools/apply_gdn_wrapper_tests.py
          cp tools/apply_vllm_metal_gdn_broad_compat.py \
            work/vllm-metal/tools/apply_gdn_broad_compat.py
          python3 -m py_compile \
            work/vllm-metal/tools/apply_gdn_spec_blocks.py \
            work/vllm-metal/tools/apply_gdn_spec_safety.py \
            work/vllm-metal/tools/apply_gdn_spec_test_updates.py \
            work/vllm-metal/tools/apply_gdn_wrapper_tests.py \
            work/vllm-metal/tools/apply_gdn_broad_compat.py
          cd work/vllm-metal
          set -o pipefail
          {
            python3 tools/apply_gdn_spec_blocks.py
            python3 tools/apply_gdn_spec_safety.py
            python3 tools/apply_gdn_spec_test_updates.py
            python3 tools/apply_gdn_wrapper_tests.py
            python3 tools/apply_gdn_broad_compat.py
          } 2>&1 | tee ../vllm-metal-gdn-spec-blocks-apply.log
          cp tools/apply_gdn_spec_blocks.py ../vllm-metal-gdn-spec-blocks-apply.py
          cp tools/apply_gdn_spec_safety.py ../vllm-metal-gdn-spec-safety.py
          cp tools/apply_gdn_spec_test_updates.py ../vllm-metal-gdn-spec-test-updates.py
          cp tools/apply_gdn_wrapper_tests.py ../vllm-metal-gdn-wrapper-tests.py
          cp tools/apply_gdn_broad_compat.py ../vllm-metal-gdn-broad-compat.py
          rm \
            tools/apply_gdn_spec_blocks.py \
            tools/apply_gdn_spec_safety.py \
            tools/apply_gdn_spec_test_updates.py \
            tools/apply_gdn_wrapper_tests.py \
            tools/apply_gdn_broad_compat.py
          git diff --check
          python3 -m compileall -q \
            vllm_metal/attention \
            vllm_metal/v1 \
            vllm_metal/platform.py \
            tests/attention/test_align_gdn_state_manager.py \
            tests/test_gdn_lazy_wrapper.py \
            tests/test_spec_decode_metadata.py \
            tests/test_platform.py \
            tests/test_v1_model_runner_generate.py

      - name: Install development environment and format patch
        shell: bash
        working-directory: work/vllm-metal
        run: |
          set -euxo pipefail
          source scripts/lib.sh
          setup_dev_env
          source .venv-vllm-metal/bin/activate
          ruff check --fix \
            vllm_metal/attention/context.py \
            vllm_metal/attention/impls/linear.py \
            vllm_metal/attention/runtime/base.py \
            vllm_metal/attention/runtime/hybrid.py \
            vllm_metal/attention/runtime/protocol.py \
            vllm_metal/attention/state/align.py \
            vllm_metal/v1/cache_policy.py \
            vllm_metal/v1/model_runner.py \
            vllm_metal/v1/spec_decode.py \
            vllm_metal/platform.py \
            tests/attention/test_align_gdn_state_manager.py \
            tests/test_gdn_lazy_wrapper.py \
            tests/test_spec_decode_metadata.py \
            tests/test_platform.py \
            tests/test_v1_model_runner_generate.py
          ruff format \
            vllm_metal/attention/context.py \
            vllm_metal/attention/impls/linear.py \
            vllm_metal/attention/runtime/base.py \
            vllm_metal/attention/runtime/hybrid.py \
            vllm_metal/attention/runtime/protocol.py \
            vllm_metal/attention/state/align.py \
            vllm_metal/v1/cache_policy.py \
            vllm_metal/v1/model_runner.py \
            vllm_metal/v1/spec_decode.py \
            vllm_metal/platform.py \
            tests/attention/test_align_gdn_state_manager.py \
            tests/test_gdn_lazy_wrapper.py \
            tests/test_spec_decode_metadata.py \
            tests/test_platform.py \
            tests/test_v1_model_runner_generate.py
          git diff --check
          git diff --binary > ../vllm-metal-gdn-spec-blocks.patch

      - name: Run upstream lint suite
        shell: bash
        working-directory: work/vllm-metal
        run: |
          set -o pipefail
          scripts/lint.sh 2>&1 | tee ../vllm-metal-gdn-spec-blocks-lint.log

      - name: Install pinned upstream vLLM wheel
        shell: bash
        working-directory: work/vllm-metal
        run: |
          set -o pipefail
          source .venv-vllm-metal/bin/activate
          uv pip install \
            'https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl' \
            2>&1 | tee ../vllm-metal-gdn-spec-blocks-vllm-install.log

      - name: Run focused state-transaction tests
        shell: bash
        working-directory: work/vllm-metal
        run: |
          set -o pipefail
          source .venv-vllm-metal/bin/activate
          pytest -q \
            tests/attention/test_align_gdn_state_manager.py \
            tests/attention/test_hybrid_gdn_state_manager.py \
            tests/test_gdn_lazy_wrapper.py \
            tests/test_spec_decode_metadata.py \
            tests/test_platform.py \
            tests/test_v1_model_runner_generate.py \
            2>&1 | tee ../vllm-metal-gdn-spec-blocks-tests.log

      - name: Run broader non-slow unit suite
        shell: bash
        working-directory: work/vllm-metal
        env:
          VLLM_METAL_BUILD_FROM_SOURCE: "1"
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
        run: |
          set -o pipefail
          source .venv-vllm-metal/bin/activate
          pytest -q -m 'not slow' tests/ \
            2>&1 | tee ../vllm-metal-gdn-spec-blocks-full-tests.log

      - name: Upload review patch and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-metal-gdn-spec-blocks
          path: |
            work/vllm-metal-gdn-spec-blocks.patch
            work/vllm-metal-gdn-spec-blocks-apply.log
            work/vllm-metal-gdn-spec-blocks-lint.log
            work/vllm-metal-gdn-spec-blocks-vllm-install.log
            work/vllm-metal-gdn-spec-blocks-tests.log
            work/vllm-metal-gdn-spec-blocks-full-tests.log
            work/vllm-metal-gdn-spec-blocks-apply.py
            work/vllm-metal-gdn-spec-safety.py
            work/vllm-metal-gdn-spec-test-updates.py
            work/vllm-metal-gdn-wrapper-tests.py
            work/vllm-metal-gdn-broad-compat.py
          if-no-files-found: warn
