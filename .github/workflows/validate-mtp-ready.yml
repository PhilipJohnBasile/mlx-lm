name: Validate rebased MTP PR

on:
  push:
    branches:
      - automation/validate-mtp-ready

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ready/mtp-990-upstream-main

      - uses: ./.github/actions/setup-macos

      - name: Install validation dependencies
        shell: bash -l {0}
        run: |
          pip install pre-commit unittest-xml-reporting
          pip install -e ".[test]"

      - name: Lint all files
        shell: bash -l {0}
        run: pre-commit run --all-files

      - name: Download test data
        shell: bash -l {0}
        run: |
          curl -o test_data.zip -L https://github.com/ml-explore/mlx-lm/releases/download/test_data/test_data.zip
          unzip -q test_data.zip

      - name: Run full test suite
        shell: bash -l {0}
        run: |
          METAL_DEVICE_WRAPPER_TYPE=1 METAL_DEBUG_ERROR_MODE=0 HF_HOME="." python -m xmlrunner discover -v tests -o test-results/

      - name: Run model-parallel tests
        shell: bash -l {0}
        run: mlx.launch -n 2 tests/model_parallel_tests.py
