name: Native MTP hardening handoff artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - handoff-mtp-native-hardening-20260822
    paths:
      - .github/workflows/mtp-hardening-handoff.yml
      - docs/mtp_native_hardening_handoff_20260822.md
      - docs/mtp_native_hardening_handoff_20260822.json
      - patches/**
      - tests/test_mtp_hardening_handoff.py
      - tools/apply_mtp_hardening_patches.py
      - tools/check_mtp_hardening_markers.py

permissions:
  contents: read

jobs:
  artifact-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the complete three-patch series
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check patches/0001-mtp-accepted-token-target-logprobs.patch
          git apply patches/0001-mtp-accepted-token-target-logprobs.patch
          git apply --check patches/0002-mtp-reject-stateful-logits-processors.patch
          git apply patches/0002-mtp-reject-stateful-logits-processors.patch
          git apply --check patches/0003-mtp-disable-unloaded-head.patch
          git apply patches/0003-mtp-disable-unloaded-head.patch
          python -m py_compile \
            mlx_lm/generate.py \
            mlx_lm/models/qwen3_5.py \
            mlx_lm/models/qwen3_5_moe.py \
            tests/test_mtp.py
          grep -F 'yield draft_tok_id, verify_lp, True' mlx_lm/generate.py
          grep -F 'supports only stateless logits processors' mlx_lm/generate.py
          grep -F 'def _model_supports_mtp' mlx_lm/generate.py
          grep -F 'def supports_mtp' mlx_lm/models/qwen3_5.py
          git diff --check
          git reset --hard HEAD
          test -z "$(git status --short)"

      - name: Exercise the guarded two-patch applicator
        shell: bash
        run: |
          set -euxo pipefail
          cp mlx_lm/generate.py /tmp/generate.py.original
          python tools/apply_mtp_hardening_patches.py check
          python tools/apply_mtp_hardening_patches.py apply
          python tools/apply_mtp_hardening_patches.py verify-applied
          git diff --check
          grep -F 'yield draft_tok_id, verify_lp, True' mlx_lm/generate.py
          grep -F 'supports only stateless logits processors' mlx_lm/generate.py
          python tools/apply_mtp_hardening_patches.py reverse
          cmp /tmp/generate.py.original mlx_lm/generate.py
          test -z "$(git status --short mlx_lm/generate.py)"

      - name: Compile handoff Python files
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            tests/test_mtp_hardening_handoff.py \
            tools/apply_mtp_hardening_patches.py \
            tools/check_mtp_hardening_markers.py

      - name: Validate machine-readable manifest
        shell: bash
        run: |
          set -euxo pipefail
          python -m json.tool \
            docs/mtp_native_hardening_handoff_20260822.json \
            >/dev/null

      - name: Explain scope
        shell: bash
        run: |
          cat <<'EOF'
          This workflow validates only the handoff artifacts:
          - the three focused patches apply in order to the inspected branch point;
          - modified Python files parse and the expected markers are present;
          - the guarded two-patch applicator still applies and reverses cleanly;
          - the JSON manifest is valid.

          It does not assert that the intentionally red transactional-cache
          acceptance suite passes before the remaining cache work is integrated.
          EOF
