name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/head/main' }}

jobs:
  check_lint:
    if: github.repository == 'ml-explore/mlx-lm'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  mac_build_and_test:
    if: github.repository == 'ml-explore/mlx-lm'
    runs-on: [self-hosted, macos]
    needs: check_lint
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-macos
      - name: Install test dependencies
        shell: bash -l {0}
        run: |
          pip install unittest-xml-reporting
          pip install -e ".[test]"
      - name: Run tests
        shell: bash -l {0}
        run: |
          curl -o test_data.zip -L https://github.com/ml-explore/mlx-lm/releases/download/test_data/test_data.zip
          unzip test_data.zip
          METAL_DEVICE_WRAPPER_TYPE=1 METAL_DEBUG_ERROR_MODE=0 HF_HOME="." python -m xmlrunner discover -v tests -o test-results/
          mlx.launch -n 2 tests/model_parallel_tests.py

  finalize_mtp_hardening_branch:
    if: >-
      github.repository == 'PhilipJohnBasile/mlx-lm' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'trigger/mtp-native-cleanup-final'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mtp-native-transactional-hardening
          fetch-depth: 0

      - name: Restore base server behavior and squash to one commit
        env:
          BASE_SHA: e8ceeccf118d4a089e22431f28f89d5ffe7d9d2b
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("mlx_lm/server.py")
          lines = path.read_text().splitlines(keepends=True)
          signature = "def load(self, model_path, adapter_path=None, draft_model_path=None):"
          model_line = "model_path = self._model_map.get(model_path, model_path)"
          adapter_line = "adapter_path = self._adapter_map.get(model_path, adapter_path)"

          def_index = next(
              index for index, line in enumerate(lines) if line.strip() == signature
          )
          window = range(def_index + 1, min(def_index + 8, len(lines)))
          model_index = next(index for index in window if lines[index].strip() == model_line)
          adapter_index = next(
              index for index in window if lines[index].strip() == adapter_line
          )

          if model_index < adapter_index:
              lines[model_index], lines[adapter_index] = (
                  lines[adapter_index],
                  lines[model_index],
              )
          elif adapter_index > model_index:
              raise RuntimeError("unexpected adapter/model resolution ordering")

          path.write_text("".join(lines))
          PY

          git diff --check
          git reset --soft "$BASE_SHA"
          git add -A

          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git commit -F - <<'COMMIT_MESSAGE'
          fix(mtp): harden transactional cache, logprobs, and guards

          Carry the selected correctness work from ml-explore/mlx-lm#1740 onto
          AirRunner/mlx-lm:feat/mtp-native at e8ceeccf118d4a089e22431f28f89d5ffe7d9d2b.

          This preserves transactional multi-turn prompt-cache alignment and
          finalization, target/verifier log probabilities for accepted drafts,
          usable-head detection, fail-closed logits-processor handling, and the
          focused regression coverage.

          Source: PhilipJohnBasile/mlx-lm@bc1d11414c12372cdf76538e09ce1fbc54b7fc7b

          Signed-off-by: Philip John Basile <PBasile@Basilecom.com>
          COMMIT_MESSAGE

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          expected=$(cat <<'EXPECTED_FILES'
          mlx_lm/generate.py
          mlx_lm/models/cache.py
          mlx_lm/models/qwen3_5.py
          mlx_lm/models/qwen3_5_moe.py
          mlx_lm/server.py
          tests/test_mtp.py
          EXPECTED_FILES
          )
          actual=$(git diff --name-only "$BASE_SHA" HEAD | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

          python - <<'PY'
          from pathlib import Path

          lines = Path("mlx_lm/server.py").read_text().splitlines()
          signature = "def load(self, model_path, adapter_path=None, draft_model_path=None):"
          model_line = "model_path = self._model_map.get(model_path, model_path)"
          adapter_line = "adapter_path = self._adapter_map.get(model_path, adapter_path)"
          def_index = next(
              index for index, line in enumerate(lines) if line.strip() == signature
          )
          window = [line.strip() for line in lines[def_index + 1 : def_index + 8]]
          if window.index(adapter_line) >= window.index(model_line):
              raise RuntimeError("base adapter-alias resolution order was not preserved")
          PY

          git push --force-with-lease origin HEAD:fix/mtp-native-transactional-hardening
