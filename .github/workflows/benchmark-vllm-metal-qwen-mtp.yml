name: Benchmark vLLM Metal native Qwen MTP serving

on:
  push:
    branches:
      - stack/vllm-metal-610-merge-ready
    paths:
      - .github/workflows/benchmark-vllm-metal-qwen-mtp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vllm-metal-qwen-mtp-serving-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MODEL_SOURCE: Qwen/Qwen3.5-2B
      MODEL_DIR: /tmp/qwen35-2b-mtp-4bit
      VLLM_METAL_USE_PAGED_ATTENTION: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout hardened MLX-LM MTP branch
        uses: actions/checkout@v5
        with:
          ref: stack/vllm-metal-610-merge-ready
          path: mlx-lm
          fetch-depth: 0

      - name: Checkout consolidated vLLM Metal feature
        uses: actions/checkout@v5
        with:
          repository: PhilipJohnBasile/vllm-metal
          ref: pr/610-05-paged-qwen-mtp-prefix
          path: vllm-metal
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install and build Apple-Silicon serving environment
        shell: bash
        working-directory: vllm-metal
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip uv
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install \
            'https://github.com/vllm-project/vllm/releases/download/v0.27.1/vllm-0.27.1%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl'
          VLLM_METAL_BUILD_FROM_SOURCE=1 python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e ../mlx-lm
          source scripts/lib.sh
          ensure_metal_toolchain
          build_native_artifacts
          python - <<'PY'
          import platform
          import mlx.core as mx
          import torch
          import mlx_lm
          print('machine=', platform.machine())
          print('mlx_device=', mx.default_device())
          print('mps_built=', torch.backends.mps.is_built())
          print('mps_available=', torch.backends.mps.is_available())
          print('mlx_lm=', mlx_lm.__file__)
          assert platform.machine() == 'arm64'
          assert torch.backends.mps.is_available()
          PY

      - name: Convert Qwen3.5-2B with trained MTP tensors preserved
        shell: bash
        working-directory: vllm-metal
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          rm -rf "$MODEL_DIR"
          python -m mlx_lm.convert \
            --hf-path "$MODEL_SOURCE" \
            --mlx-path "$MODEL_DIR" \
            -q --q-bits 4 --q-group-size 64
          python - <<'PY'
          import json, os
          from mlx_lm import load
          model_dir = os.environ['MODEL_DIR']
          model, _ = load(model_dir)
          assert bool(getattr(model, 'supports_mtp', False)), 'converted checkpoint lost MTP tensors'
          config = json.load(open(os.path.join(model_dir, 'config.json')))
          text = config.get('text_config', config)
          assert int(text.get('mtp_num_hidden_layers', 0)) == 1
          print('native MTP checkpoint verified:', model_dir)
          PY
          rm -rf "$HOME/.cache/huggingface/hub/models--Qwen--Qwen3.5-2B" || true
          df -h .

      - name: Write deterministic serving benchmark client
        shell: bash
        working-directory: vllm-metal
        run: |
          cat > /tmp/bench_mtp.py <<'PY'
          import argparse
          import json
          import statistics
          import time
          import urllib.request
          from transformers import AutoTokenizer

          def post_stream(url, payload, tokenizer):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=body, headers={'Content-Type':'application/json'})
              start = time.perf_counter()
              first = None
              text = ''
              with urllib.request.urlopen(req, timeout=300) as resp:
                  for raw in resp:
                      line = raw.decode('utf-8', errors='replace').strip()
                      if not line.startswith('data: '):
                          continue
                      data = line[6:]
                      if data == '[DONE]':
                          break
                      obj = json.loads(data)
                      choice = obj.get('choices', [{}])[0]
                      piece = choice.get('text')
                      if piece is None:
                          piece = choice.get('delta', {}).get('content', '')
                      if piece:
                          if first is None:
                              first = time.perf_counter()
                          text += piece
              end = time.perf_counter()
              if first is None:
                  first = end
              n_tokens = len(tokenizer.encode(text, add_special_tokens=False))
              return {'ttft_s': first-start, 'latency_s': end-start,
                      'decode_s': max(end-first, 1e-9), 'output_tokens': n_tokens}

          def metrics(base_url):
              try:
                  with urllib.request.urlopen(base_url + '/metrics', timeout=10) as r:
                      return r.read().decode()
              except Exception:
                  return ''

          def counter(text, stem):
              total = 0.0
              for line in text.splitlines():
                  if line.startswith('#') or not line.startswith(stem) or '_created' in line:
                      continue
                  try:
                      total += float(line.rsplit(' ', 1)[1])
                  except Exception:
                      pass
              return total

          p = argparse.ArgumentParser()
          p.add_argument('--label', required=True)
          p.add_argument('--model', required=True)
          p.add_argument('--base-url', default='http://127.0.0.1:8000')
          p.add_argument('--requests', type=int, default=12)
          p.add_argument('--max-tokens', type=int, default=128)
          p.add_argument('--out', required=True)
          a = p.parse_args()
          tok = AutoTokenizer.from_pretrained(a.model, trust_remote_code=True)
          seed = ('Apple Silicon inference benchmark. Explain carefully and precisely. ' * 180)
          seed_ids = tok.encode(seed, add_special_tokens=False)
          if len(seed_ids) > 1024:
              seed = tok.decode(seed_ids[:1024])
          prompts = [seed + f'\nCase {i}: give a concise technical explanation of speculative decoding.' for i in range(a.requests)]
          endpoint = a.base_url + '/v1/completions'
          common = {'model': a.model, 'max_tokens': a.max_tokens, 'temperature': 0, 'stream': True}
          post_stream(endpoint, dict(common, prompt=prompts[0], max_tokens=32), tok)
          before = metrics(a.base_url)
          rows = []
          wall0 = time.perf_counter()
          for prompt in prompts:
              rows.append(post_stream(endpoint, dict(common, prompt=prompt), tok))
          wall = time.perf_counter() - wall0
          after = metrics(a.base_url)
          total_out = sum(r['output_tokens'] for r in rows)
          total_decode = sum(r['decode_s'] for r in rows)
          drafts = max(0.0, counter(after, 'vllm:spec_decode_num_draft_tokens_total') - counter(before, 'vllm:spec_decode_num_draft_tokens_total'))
          accepted = max(0.0, counter(after, 'vllm:spec_decode_num_accepted_tokens_total') - counter(before, 'vllm:spec_decode_num_accepted_tokens_total'))
          result = {
              'label': a.label, 'model': a.model, 'requests': a.requests,
              'shared_prompt_tokens': len(tok.encode(seed, add_special_tokens=False)),
              'max_output_tokens': a.max_tokens, 'output_tokens': total_out, 'wall_s': wall,
              'output_tok_s': total_out / total_decode if total_decode else 0.0,
              'end_to_end_tok_s': total_out / wall if wall else 0.0,
              'mean_ttft_ms': 1000 * statistics.mean(r['ttft_s'] for r in rows),
              'median_ttft_ms': 1000 * statistics.median(r['ttft_s'] for r in rows),
              'mean_latency_ms': 1000 * statistics.mean(r['latency_s'] for r in rows),
              'mtp_drafted_tokens': drafts, 'mtp_accepted_tokens': accepted,
              'mtp_acceptance_pct': (100.0 * accepted / drafts) if drafts else None,
              'rows': rows,
          }
          with open(a.out, 'w') as f: json.dump(result, f, indent=2)
          print('BENCH_RESULT=' + json.dumps(result, sort_keys=True))
          PY

      - name: Baseline serving — prefix cache, MTP off
        shell: bash
        working-directory: vllm-metal
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          rm -f /tmp/vllm-baseline.log
          vllm serve "$MODEL_DIR" --host 127.0.0.1 --port 8000 \
            --enable-prefix-caching --max-model-len 4096 \
            > /tmp/vllm-baseline.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; tail -200 /tmp/vllm-baseline.log || true' EXIT
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            if ! kill -0 $pid 2>/dev/null; then cat /tmp/vllm-baseline.log; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          python /tmp/bench_mtp.py --label baseline --model "$MODEL_DIR" --out /tmp/baseline.json
          kill $pid
          wait $pid || true
          trap - EXIT
          tail -100 /tmp/vllm-baseline.log

      - name: Feature serving — prefix cache plus native Qwen MTP
        shell: bash
        working-directory: vllm-metal
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          rm -f /tmp/vllm-mtp.log
          vllm serve "$MODEL_DIR" --host 127.0.0.1 --port 8000 \
            --enable-prefix-caching --max-model-len 4096 \
            --speculative-config '{"method":"mtp","num_speculative_tokens":1}' \
            > /tmp/vllm-mtp.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; tail -250 /tmp/vllm-mtp.log || true' EXIT
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            if ! kill -0 $pid 2>/dev/null; then cat /tmp/vllm-mtp.log; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          python /tmp/bench_mtp.py --label mtp --model "$MODEL_DIR" --out /tmp/mtp.json
          kill $pid
          wait $pid || true
          trap - EXIT
          tail -150 /tmp/vllm-mtp.log

      - name: Summarize A/B serving results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data = [json.load(open(p)) for p in ['/tmp/baseline.json','/tmp/mtp.json'] if os.path.exists(p)]
          out = {'hardware':'GitHub macos-15 arm64 Apple Silicon', 'results':data}
          if len(data) == 2:
              b, m = data
              out['speedup_output'] = m['output_tok_s'] / b['output_tok_s'] if b['output_tok_s'] else None
              out['speedup_end_to_end'] = m['end_to_end_tok_s'] / b['end_to_end_tok_s'] if b['end_to_end_tok_s'] else None
              out['ttft_ratio'] = m['mean_ttft_ms'] / b['mean_ttft_ms'] if b['mean_ttft_ms'] else None
          with open('/tmp/serving-benchmark.json','w') as f: json.dump(out, f, indent=2)
          print(json.dumps(out, indent=2))
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-mtp-serving-benchmark
          path: |
            /tmp/serving-benchmark.json
            /tmp/baseline.json
            /tmp/mtp.json
            /tmp/vllm-baseline.log
            /tmp/vllm-mtp.log
          if-no-files-found: warn
